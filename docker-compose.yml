version: '3.8'

services:
  golden-transfers-api:
    build: .
    container_name: golden-transfers-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:golden_db
      - SPRING_DATASOURCE_USERNAME=gusta
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_H2_CONSOLE_ENABLED=true
    networks:
      - golden-network

networks:
  golden-network:
    driver: bridge